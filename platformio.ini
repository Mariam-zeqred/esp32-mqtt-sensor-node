; esp32-mqtt-sensor-node
;   esp32dev : the firmware (ESP32 DevKit v1, Arduino framework)
;   native   : host-side unit tests for the hardware-free core (JSON, backoff, plausibility)
;
; Build/flash:   pio run -e esp32dev -t upload && pio device monitor
; Host tests:    pio test -e native

[platformio]
default_envs = esp32dev

[env]
test_framework = custom
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -DFW_VERSION=\"0.1.0\"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The broker's root CA is embedded into the binary; generate it with tools/make_certs.sh
board_build.embed_txtfiles = certs/ca.crt
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1
; Unit tests only run on the host.
test_ignore = *

[env:native]
; Runs test/test_native/test_core.cpp (self-contained asserts, no package download).
platform = native
build_flags =
    ${env.build_flags}
    -DNATIVE_TEST
lib_compat_mode = off
